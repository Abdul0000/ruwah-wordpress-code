name: WordPress MCP Pipeline
run-name: >-
  wordpress-mcp | ${{ inputs.client_name }} | ${{ inputs.idempotency_key }} | ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        type: string
      branch:
        description: Locked source branch
        required: true
        type: string
      commit_sha:
        description: Exact commit to validate and deploy
        required: true
        type: string
      client_name:
        description: MCP client identifier
        required: true
        type: string
      idempotency_key:
        description: Durable request identity
        required: true
        type: string
      request_sha256:
        description: Hash of the typed MCP request
        required: true
        type: string
      deploy_requested:
        description: Whether staging deployment is required
        required: true
        type: string
      verification_required:
        description: Whether terminal verification is required
        required: true
        type: string
      debug_mode:
        description: Whether exact debug replay is required
        required: true
        type: string
      success_claim:
        description: Claim allowed only after complete pipeline success
        required: true
        type: string
      source_path:
        description: Owned plugin/theme path in this repository
        required: true
        type: string
      deploy_path:
        description: Absolute target path on the WordPress server
        required: true
        type: string
      wordpress_path:
        description: Absolute WordPress installation path on the server
        required: true
        type: string
      deploy_type:
        description: plugin or theme
        required: true
        type: string
      deploy_slug:
        description: Plugin/theme slug to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wordpress-mcp-${{ inputs.client_name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  qa:
    name: Focused source QA
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Validate immutable request fields
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SOURCE_PATH" != /* ]]
          [[ "$SOURCE_PATH" != *".."* ]]
          [[ "$SOURCE_PATH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_TYPE" == "plugin" || "$DEPLOY_TYPE" == "theme" ]]

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Confirm source is bounded and owned
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          test -d "$SOURCE_PATH"
          case "$SOURCE_PATH" in
            wp-content/plugins/*|wp-content/themes/*) ;;
            *) echo "Source must be under wp-content/plugins or wp-content/themes" >&2; exit 1 ;;
          esac
          test "$(find "$SOURCE_PATH" -type f | wc -l)" -le 5000

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.WORDPRESS_PHP_VERSION || '8.2' }}
          coverage: none
          tools: composer:v2

      - name: PHP syntax
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find "$SOURCE_PATH" -type f -name '*.php' -print0)
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Composer validation and tests when configured
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          if [ -f "$SOURCE_PATH/composer.json" ]; then
            cd "$SOURCE_PATH"
            composer validate --strict
            composer install --no-interaction --prefer-dist --no-progress
            if composer run-script --list | grep -Eq '^  (test|tests|phpunit|check)'; then
              composer run-script test || composer run-script tests || composer run-script phpunit || composer run-script check
            fi
          fi

      - name: JavaScript build when configured
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          if [ -f "$SOURCE_PATH/package-lock.json" ]; then
            cd "$SOURCE_PATH"
            npm ci --no-audit --no-fund
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          fi

  deploy:
    name: Backup, deploy, verify, rollback
    needs: qa
    if: ${{ inputs.deploy_requested == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WORDPRESS_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Validate deployment paths
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          WORDPRESS_PATH: ${{ inputs.wordpress_path }}
        run: |
          set -euo pipefail
          test -d "$SOURCE_PATH"
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != "/" && "$DEPLOY_PATH" != *".."* ]]
          [[ "$WORDPRESS_PATH" == /* && "$WORDPRESS_PATH" != "/" && "$WORDPRESS_PATH" != *".."* ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$WORDPRESS_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]

      - name: Create remote rollback point
        id: backup
        env:
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
          SSH_USER: ${{ secrets.WORDPRESS_SSH_USER }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
        run: |
          set -euo pipefail
          backup="/tmp/wordpress-mcp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_PATH" "$backup" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          backup="$2"
          if [ -e "$deploy_path" ]; then
            tar -czf "$backup" -C "$(dirname "$deploy_path")" "$(basename "$deploy_path")"
          else
            : > "${backup}.missing"
          fi
          REMOTE
          echo "backup_path=$backup" >> "$GITHUB_OUTPUT"

      - name: Deploy owned source atomically
        env:
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
          SSH_USER: ${{ secrets.WORDPRESS_SSH_USER }}
          SOURCE_PATH: ${{ inputs.source_path }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
        run: |
          set -euo pipefail
          parent="$(dirname "$DEPLOY_PATH")"
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p -- '$parent'"
          rsync -az --delete --delay-updates "$SOURCE_PATH/" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Remote PHP syntax
        env:
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
          SSH_USER: ${{ secrets.WORDPRESS_SSH_USER }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
        run: |
          set -euo pipefail
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          find "$deploy_path" -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          REMOTE

      - name: Flush relevant WordPress cache
        env:
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
          SSH_USER: ${{ secrets.WORDPRESS_SSH_USER }}
          WORDPRESS_PATH: ${{ inputs.wordpress_path }}
        run: |
          set -euo pipefail
          ssh "$SSH_USER@$SSH_HOST" wp --path="$WORDPRESS_PATH" cache flush

      - name: Verify activation and site health
        env:
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
          SSH_USER: ${{ secrets.WORDPRESS_SSH_USER }}
          WORDPRESS_PATH: ${{ inputs.wordpress_path }}
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
          DEPLOY_SLUG: ${{ inputs.deploy_slug }}
          SITE_URL: ${{ vars.WORDPRESS_STAGING_URL }}
          VERIFICATION_REQUIRED: ${{ inputs.verification_required }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          if [ "$DEPLOY_TYPE" = "plugin" ]; then
            ssh "$SSH_USER@$SSH_HOST" wp --path="$WORDPRESS_PATH" plugin status "$DEPLOY_SLUG"
          else
            ssh "$SSH_USER@$SSH_HOST" wp --path="$WORDPRESS_PATH" theme status "$DEPLOY_SLUG"
          fi
          if [ "$VERIFICATION_REQUIRED" = "true" ]; then
            test -n "$SITE_URL"
            curl --fail --silent --show-error --location --max-redirs 0 --max-time 30 "$SITE_URL" >/dev/null
          fi

      - name: Restore rollback point after failure
        if: ${{ failure() && steps.backup.outputs.backup_path != '' }}
        env:
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
          SSH_USER: ${{ secrets.WORDPRESS_SSH_USER }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          BACKUP_PATH: ${{ steps.backup.outputs.backup_path }}
        run: |
          set -euo pipefail
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_PATH" "$BACKUP_PATH" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          backup="$2"
          rm -rf -- "$deploy_path"
          if [ -f "$backup" ]; then
            mkdir -p -- "$(dirname "$deploy_path")"
            tar -xzf "$backup" -C "$(dirname "$deploy_path")"
          fi
          REMOTE

      - name: Remove temporary rollback files after success
        if: ${{ success() }}
        env:
          SSH_HOST: ${{ secrets.WORDPRESS_SSH_HOST }}
          SSH_USER: ${{ secrets.WORDPRESS_SSH_USER }}
          BACKUP_PATH: ${{ steps.backup.outputs.backup_path }}
        run: |
          set -euo pipefail
          ssh "$SSH_USER@$SSH_HOST" "rm -f -- '$BACKUP_PATH' '${BACKUP_PATH}.missing'"
